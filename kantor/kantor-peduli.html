<style>

:root{--bg:#e4efee;--panel:#fbfdfc;--ink:#17323a;--soft:#4d6a70;--line:#bcd2d1;--teal:#0f7c80;--sun:#f6b93b;--coral:#e8604c;--ok:#2d8a57;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif}

main{max-width:1680px;margin:auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}

h1{font-size:28px;font-weight:800}h2{font-size:22px}h3{font-size:16px}
p{margin:0}.soft{color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 15px var(--body);color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--teal)}button.main{background:var(--teal);border-color:var(--teal);color:#fff}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.scene{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--ink)}
.scene{height:clamp(440px,78vh,860px)}canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}.tools{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}.tools button{min-width:42px;padding:8px 12px}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.staff button{text-align:left;display:grid;gap:0;padding:8px 12px;border-left:6px solid var(--c)}
.staff small{font-weight:400;color:var(--soft)}
dialog{width:min(980px,calc(100vw - 24px));max-height:88vh;overflow:auto;border:2px solid var(--ink);border-radius:14px;padding:20px;background:var(--panel);color:var(--ink)}
@media(min-width:901px){dialog.side{width:400px;margin:auto 32px auto auto}}dialog.side::backdrop{background:transparent}
dialog::backdrop{background:rgba(23,50,58,.5)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.col{display:grid;gap:8px;align-content:start;min-width:0}
.col h3{display:flex;justify-content:space-between;border-bottom:3px solid var(--k);padding-bottom:4px}
.card{display:grid;gap:4px;text-align:left;width:100%;overflow-wrap:anywhere}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.steps li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px}
ol.steps li b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
ol.steps li.done b{background:var(--ok);border-color:var(--ok);color:#fff}

label{display:grid;gap:4px;font-weight:600}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.note{background:#fdf0cf;border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
