<meta name="claude:viewport-fit-sides" content="cover">
<title>Kantor PEDULI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Kantor memenuhi layar; panel mengambang di atasnya seperti meja sutradara. */
:root{--petrol:#0e3038;--petrol2:#174650;--glass:rgba(11,42,50,.86);--panel:#12373f;--ink:#f2faf6;--soft:#a9c9c7;--line:rgba(190,231,224,.18);--teal:#37b5a5;--sun:#ffc94d;--coral:#ff7e67;--ok:#62cf8d;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#9fc9bd;color:var(--ink);font:400 15px/1.5 var(--body);overflow:hidden}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}h2{font-size:24px;font-weight:800}h3{font-size:17px;font-weight:700}p{margin:0}.soft,small{color:var(--soft)}
[hidden]{display:none!important}
button{font:600 15px var(--body);color:var(--ink);background:rgba(255,255,255,.08);border:0;border-radius:10px;padding:9px 14px;min-height:42px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:rgba(255,255,255,.16)}button:active{transform:scale(.98)}button.main{background:var(--sun);color:#3a2600}button.main:hover{background:#ffd877}button:disabled{opacity:.5;cursor:default}
button.tiny{min-height:32px;padding:4px 10px;font-size:13px;font-weight:500;background:none;color:var(--soft);justify-self:start}button.tiny:hover{color:var(--coral);background:rgba(255,126,103,.12)}
button.plain{background:none;padding:0;min-height:0;text-align:left;display:grid;gap:4px;width:100%;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.tools{z-index:2;position:fixed;left:20px;top:104px;display:grid;gap:6px;justify-items:start}.tools button{background:var(--glass);min-width:42px}
header{z-index:2;position:fixed;left:20px;top:16px;right:430px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;pointer-events:none}header>*{pointer-events:auto}
.merek{background:var(--glass);border-radius:16px;padding:10px 18px 11px}.merek h1{font-size:25px;font-weight:800;letter-spacing:-.02em}.merek p{font-size:13px}
header .row{background:var(--glass);border-radius:16px;padding:8px}
#siaga{display:flex;align-items:center;gap:7px;color:var(--sun)}#siaga:before{content:"";width:9px;height:9px;border-radius:50%;background:#6f8f90}#siaga.on{color:var(--ok)}#siaga.on:before{background:var(--ok)}.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px 12px}.gkartu{display:grid;gap:3px;padding:0 0 8px;background:none;text-align:left;align-content:start;overflow-wrap:anywhere}.gkartu:hover{background:none}.gkartu:hover img{outline:3px solid var(--sun)}.gkartu img,.gkartu .kosong{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:#071d23;display:grid;place-items:center;font:800 34px var(--display)}.gkartu small{font-weight:400}.gbesar{max-height:62vh;border-radius:14px;justify-self:center}.stills{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stills img{width:100%;border-radius:10px}#nAsk{background:var(--coral);color:#3a0d05;border-radius:99px;font-style:normal;font-size:12px;padding:1px 7px;margin-left:7px}
.obrol{position:fixed;right:16px;top:16px;bottom:16px;width:390px;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--glass);backdrop-filter:blur(14px);border-radius:20px;overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 10px 0}.tabs button{flex:1;background:none;color:var(--soft);border-radius:12px 12px 0 0}.tabs button[aria-pressed=true]{background:rgba(255,255,255,.1);color:var(--ink)}
#talk{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}#log,#hasilList{overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.04);scrollbar-color:#41717a transparent}
#fs{display:grid;gap:8px;padding:12px}#fs .kirim{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.putus.statis,.putus:has(.statis){position:static}.putus .opsi small{color:#4a3b1c;opacity:1}.gpilih{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.gpilih img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;display:block}.gpilih small{display:block;margin-top:4px;line-height:1.35}.lk{padding-left:22px}.lk li{margin:9px 0}.lk small{display:block;opacity:.8}.lk .beres b::after{content:" ✓"}.lk .beres{opacity:.75}.lk .sekarang b{color:#f6b93b}.lk .nanti{opacity:.5}.opsi{display:block;width:100%;text-align:left;margin:4px 0}.opsi[aria-pressed=true]{outline:3px solid #f6b93b}.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{min-height:34px;padding:4px 12px;font-size:13.5px}#actStop{background:rgba(255,126,103,.25);margin-left:auto}#hint{font-size:13px}#hint:empty{display:none}#say{resize:none}
label{display:grid;gap:4px;font-weight:600}input,textarea,select{font:400 16px var(--body);color:var(--ink);background:#0b2a32;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}::placeholder{color:#86aaaa}
.msg{display:flex;gap:9px;align-items:flex-end;max-width:95%}.msg.you{align-self:flex-end;flex-direction:row-reverse}
.av{width:34px;height:34px;border-radius:12px;color:#fff;font:800 15px var(--display);display:grid;place-items:center;flex:none}.you .av{color:#3a2600}
.bb{background:#1c4c56;border-radius:16px 16px 16px 5px;padding:9px 13px;display:grid;gap:3px;overflow-wrap:anywhere;white-space:pre-wrap;min-width:0}.you .bb{background:#ffe2a0;color:#33240a;border-radius:16px 16px 5px 16px}.you .bb small{color:#775c24}.bb small b{color:inherit}
.dots{display:flex;gap:5px;padding:13px 14px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dt{40%{transform:translateY(-5px)}}
.lamp{width:100%;max-height:340px;object-fit:contain;border-radius:10px;background:#071d23}audio{width:100%;height:38px}
.kartu{display:grid;gap:9px;background:#fff4d6;color:#33260d;border-radius:16px;padding:14px}.kartu>b{font:700 17px var(--display)}.kartu .soft{color:#6c5a32}
.film{display:grid;grid-template-columns:62px 1fr;gap:12px;text-align:left;padding:8px;align-items:center;border-radius:14px;width:100%}.film img,.film .kosong{width:62px;height:82px;object-fit:cover;border-radius:9px;background:#0b2a32;display:grid;place-items:center;font:800 26px var(--display)}.film>span:last-child{display:grid;gap:2px;min-width:0;overflow-wrap:anywhere}.film small{font-weight:400}.film.w{background:rgba(255,201,77,.17)}
.dock{position:fixed;left:20px;right:430px;bottom:16px;display:grid;gap:8px;pointer-events:none}.dock>*{pointer-events:auto}
#live{display:flex;gap:8px;flex-wrap:wrap}.reel{display:grid;gap:8px;flex:1 1 260px;max-width:520px;background:var(--glass);border-radius:14px;padding:10px 14px;text-align:left}.reel:hover{background:var(--petrol2)}.rh{display:flex;justify-content:space-between;gap:12px;min-width:0}.rh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rh small{white-space:nowrap}
.track{display:flex;gap:3px}.track i{flex:1;height:9px;border-radius:3px;background:rgba(255,255,255,.16)}.track .d{background:var(--ok)}.track .w{background:var(--sun)}.track .n{background:var(--teal);animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.45}}
#team{display:flex;gap:4px;background:var(--glass);border-radius:16px;padding:7px;overflow-x:auto;scrollbar-width:none}#team .who{position:relative;flex:1 0 98px;display:grid;justify-items:center;gap:3px;padding:8px 4px;background:none;min-width:0}#team .who:hover{background:rgba(255,255,255,.1)}#team .wt{display:grid;justify-items:center;max-width:100%;min-width:0}#team .wt b,#team .wt small{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:1.3}#team .rl{font-size:11.5px;color:var(--sun);font-weight:500;white-space:nowrap}#team .wt small{font-size:11.5px;font-weight:400}.led{position:absolute;top:8px;left:calc(50% + 11px);width:11px;height:11px;border-radius:50%;background:#6f8f90;border:2px solid var(--petrol)}.led.on{background:var(--ok);animation:pl 1.3s infinite}
.bar{display:block;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
dialog{color-scheme:dark;width:min(980px,calc(100vw - 24px));max-height:92vh;overflow:auto;border:0;border-radius:22px;padding:24px;background:var(--panel);color:var(--ink);box-shadow:0 24px 80px rgba(3,22,28,.5)}dialog.wide{width:min(1120px,calc(100vw - 24px));min-height:70vh}dialog::backdrop{background:rgba(7,34,41,.55)}dialog>div,form{display:grid;gap:14px}
@media(min-width:981px){dialog.side{width:390px;margin:16px 16px 16px auto;height:calc(100vh - 32px);max-height:none}dialog.side::backdrop{background:transparent}}
.hasil{display:none}.peran{color:var(--sun);font-weight:600}.kabar{border-left:3px solid var(--teal);padding-left:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.col{display:grid;gap:8px;align-content:start;min-width:0}.col h3{display:flex;justify-content:space-between;border-bottom:3px solid var(--k);padding-bottom:5px}.card{display:grid;gap:4px;background:rgba(255,255,255,.07);border-radius:12px;padding:12px 12px 6px;min-width:0}
.note{background:rgba(255,201,77,.15);border-radius:10px;padding:10px 13px;overflow-wrap:anywhere}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}code{user-select:all;background:#0b2a32;padding:2px 6px;border-radius:4px}
.langkah{display:flex;gap:3px;overflow-x:auto}.langkah span{flex:1 0 auto;padding:5px 10px;font-size:12.5px;background:rgba(255,255,255,.07);color:var(--soft);white-space:nowrap}.langkah span:first-child{border-radius:8px 0 0 8px}.langkah span:last-child{border-radius:0 8px 8px 0}.langkah .d{background:#1f6b55;color:#eafff2}.langkah .n{background:var(--sun);color:#3a2600;font-weight:700}
.htabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.htabs button{background:none;color:var(--soft);border-radius:10px 10px 0 0}.htabs button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -3px var(--sun)}
.pan{display:grid;gap:14px;min-width:0}.jd{font-size:34px;max-width:22ch;padding:8px 0}.nar{max-width:68ch;display:grid;gap:2px}.nar p{font-size:20px;line-height:1.55}.nar details,.pan summary{color:var(--soft)}summary{cursor:pointer}.pan figure{margin:0;display:grid;gap:6px}.pan video{max-width:100%;max-height:66vh;border-radius:14px;background:#071d23;justify-self:center}.aud{grid-template-columns:minmax(120px,1fr) minmax(0,2fr);align-items:center}.galeri{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.galeri a{display:grid;gap:4px;text-decoration:none;min-width:0}.galeri img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#071d23}.galeri small{overflow-wrap:anywhere}.tw{overflow-x:auto}table{border-collapse:collapse;font-size:13.5px}td,th{text-align:left;vertical-align:top;padding:6px 10px;border-bottom:1px solid var(--line);min-width:70px}.cek{margin:0;padding-left:20px}
.sb{display:grid;grid-template-columns:minmax(0,auto) minmax(240px,1fr);gap:24px;align-items:center}.sbkiri{display:grid;gap:10px;justify-items:stretch}.sbimg{max-width:100%;height:min(34vh,480px);object-fit:contain;border-radius:14px;background:#071d23}.sbkanan{display:grid;gap:14px}.sbcap{font-size:22px;line-height:1.45}.sbstrip{display:flex;gap:8px;overflow-x:auto;padding:4px}.sbkecil{flex:none;width:74px;padding:0;background:none;display:grid;gap:2px}.sbkecil img{width:74px;height:92px;object-fit:cover;border-radius:9px;background:#071d23}.sbkecil[aria-pressed=true] img{outline:3px solid var(--sun)}@media(max-width:700px){.sb{grid-template-columns:1fr}}.putus{position:sticky;bottom:-24px;display:grid;gap:10px;background:#fff4d6;color:#33260d;border-radius:16px;padding:16px}.putus input,.putus textarea{background:#fff;color:#33260d;border-color:#d8c48d}.putus ::placeholder{color:#857550}.putus button:not(.main){background:#e9d9a9;color:#33260d}.putus .soft{color:#6c5a32}.putus p:empty{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:#fff4d6;color:#33260d;border-radius:14px;padding:10px 12px 10px 18px;z-index:9}#toast button{background:#e9d9a9;color:#33260d}
@media(max-width:980px){body{overflow:auto}header{position:static;flex-wrap:wrap;padding:12px;background:var(--petrol)}header .row,.merek{background:none;padding:0}.scene{position:relative;inset:auto;height:54vh}canvas{touch-action:pan-y}.tools{position:absolute;left:10px;top:10px}.dock{position:static;padding:10px;background:var(--petrol)}.obrol{position:static;width:auto;height:600px;border-radius:0}main{display:flex;flex-direction:column}.nar p{font-size:18px}.jd{font-size:26px}dialog{padding:16px}.putus{bottom:-16px}}
@media(prefers-reduced-motion:reduce){.dots i,.led.on,.track .n{animation:none}}
</style>
<main>
<header>
  <div class="merek"><h1>Kantor PEDULI</h1><p class="soft" id="stat">Memuat papan kerja…</p><p id="siaga" role="status">Memeriksa tim…</p></div>
  <div class="row"><button id="bPandu">Panduan</button><button id="bGaya">Gaya video</button><button id="bBoard">Papan kerja</button><button class="main" id="bNew">Buat video baru</button></div>
</header>
<div class="scene" id="scene"><div class="tools"><button id="zi" aria-label="Perbesar">+</button><button id="zo" aria-label="Perkecil">−</button><button id="ct">Tengah</button><button id="nt">Malam</button></div></div>
<div class="dock"><div id="live"></div><div id="team" aria-label="Pegawai"></div></div>
<aside class="obrol"><div class="tabs"><button id="tTalk" aria-pressed="true">Obrolan</button><button id="tHasil" aria-pressed="false">Hasil<i id="nAsk" hidden></i></button></div><div id="talk"><div id="log" aria-live="polite"></div><form id="fs"><div class="acts"><button type="button" data-act="rapat">Rapat</button><button type="button" data-act="ngopi">Ngopi</button><button type="button" data-act="senam">Senam</button><button type="button" id="actStop" hidden></button></div><select id="to" aria-label="Bicara dengan"></select><div class="kirim"><textarea id="say" rows="2" maxlength="2000" placeholder="Tanya atau beri arahan, misalnya: musiknya terlalu ramai" aria-label="Pesan"></textarea><button class="main" id="send" type="submit">Kirim</button></div><p class="soft" id="hint" role="status"></p></form></div><div id="hasilList" hidden></div></aside>
</main>
<dialog id="dlg" aria-labelledby="dT"><div id="dC"></div></dialog>
<div id="toast" role="status" hidden></div>
